<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Week 4 - Space Dodge</title>

 <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
 <h1>🚀 Space Dodge</h1>
 <p>우주선을 조종하여 떨어지는 운석을 피하세요!</p >
</header>

<main>

 <section class="game-section">

   <div class="section-title">
     <h2>🎮 운석 피하기 게임</h2>
     <p>
       방향키 또는 A / D 키를 사용하여 우주선을 움직일 수 있습니다.
       운석에 충돌하지 않고 최대한 오래 살아남아 보세요.
     </p >
   </div>

   <div class="game-info">

     <div class="info-box">
       <span>점수</span>
       <strong id="score">0</strong>
     </div>

     <div class="info-box">
       <span>최고 점수</span>
       <strong id="bestScore">0</strong>
     </div>

   </div>

   <canvas id="gameCanvas" width="700" height="450"></canvas>

   <div class="game-buttons">
     <button id="startBtn">게임 시작</button>
     <button id="resetBtn">다시 시작</button>
   </div>

   <p class="control">
     조작 방법 : ← → 방향키 / A D
   </p >

 </section>


 <section class="report-section">

   <h2>📊 플레이 기록</h2>

   <p>
     게임 플레이 결과를 이용하여 점수 변화를 확인할 수 있습니다.
     게임을 반복하면 아래 영역에 최근 플레이 기록이 표시됩니다.
   </p >

   <div id="history">
     아직 플레이 기록이 없습니다.
   </div>

 </section>

</main>


<footer>
 <p>Web Programming · Week 4</p >
</footer>


<script src="game.js"></script>

</body>
</html>
